<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fernanda Louzada | Lash Designer</title>
<meta name="description" content="Fernanda Louzada — Lash Designer. Entre em contato pelo WhatsApp ou Instagram.">
<style>
:root {
  --vinho:#65051d;
  --vinho2:#8b1635;
  --creme:#fff8f8;
  --texto:#32151d;
}
* { box-sizing:border-box; }
body {
  margin:0;
  min-height:100vh;
  font-family:Arial, Helvetica, sans-serif;
  color:var(--texto);
  background:linear-gradient(145deg,#3f0717,#5a0d24);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:24px 16px;
}
.card {
  width:min(430px,100%);
  text-align:center;
  background:rgba(255,255,255,.84);
  backdrop-filter:blur(10px);
  border:1px solid rgba(101,5,29,.10);
  border-radius:28px;
  padding:30px 22px 24px;
  box-shadow:0 18px 55px rgba(75,8,27,.15);
}
.logo {
  width:132px;
  height:132px;
  object-fit:cover;
  border-radius:50%;
  display:block;
  margin:0 auto 18px;
  border:5px solid white;
  box-shadow:0 8px 25px rgba(101,5,29,.20);
}
h1 {
  margin:0;
  font-family:Georgia,serif;
  font-size:29px;
  color:var(--vinho);
}
.subtitle {
  margin:7px 0 20px;
  font-size:15px;
  letter-spacing:1.8px;
  text-transform:uppercase;
  color:#76515a;
}
.bio {
  font-size:15px;
  line-height:1.55;
  margin:0 0 22px;
  max-width:350px;
  text-align:left;
  white-space:normal;
}
.btn {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
  min-height:58px;
  margin:12px 0;
  padding:15px 18px;
  border-radius:16px;
  text-decoration:none;
  font-weight:700;
  font-size:16px;
  transition:.2s ease;
}
.btn:hover { transform:translateY(-2px); }
.whatsapp {
  background:var(--vinho2);
  color:white;
  box-shadow:0 8px 20px rgba(101,5,29,.20);
}
.instagram {
  background:var(--vinho);
  color:white;
  box-shadow:0 8px 20px rgba(101,5,29,.20);
}
.info {
  margin-top:20px;
  padding-top:18px;
  border-top:1px solid #ead9dd;
  color:#76515a;
  font-size:13px;
}
.heart { color:var(--vinho); }
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="logo.jpg" alt="Fernanda Louzada Lash Designer">
  <h1>Fernanda Louzada</h1>
  <div class="subtitle">Lash Designer ✨</div>

  <p class="bio">
    Saúde/beleza<br>
    🍓 LASH DESIGNER<br>
    🍓 Designer de Sobrancelhas<br>
    🍓 Técnica fio a fio<br>
    🍓 Studio R Tomaraca, 6 | ZL<br>
    🍓 Faça seu orçamento via dm ou whatsapp ✨
  </p>

  <a class="btn whatsapp"
     href="https://wa.me/5511988961098?text=Ol%C3%A1%20tudo%20bem%2C%20gostaria%20de%20saber%20mais%20sobre%20os%20servi%C3%A7os%20de%20Lash%20por%20favor%21"
     target="_blank" rel="noopener">
    <span>💬</span> Falar comigo no WhatsApp
  </a>

  <a class="btn instagram"
     href="https://www.instagram.com/lash.louzada/"
     target="_blank" rel="noopener">
    <span>📷</span> Ver Instagram
  </a>

  <div class="info">
    Atendimento com carinho e cuidado <span class="heart">♥</span><br>
    Fernanda Louzada • Lash Designer
  </div>
</main>
</body>
</html>
